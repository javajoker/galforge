<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="ECHO — cover">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#10182a"/>
      <stop offset="55%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .ttl { font: 800 300px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 22px; }
      .sub { font: 600 34px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 10px; }
      .han { font: 700 64px/1 "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; letter-spacing: 26px; }
      .tag { font: 600 22px/1 ui-monospace, Menlo, monospace; letter-spacing: 4px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- three-protocol vertical bands: Order / Chaos / Shelter -->
  <g opacity="0.16">
    <rect x="430"  y="0" width="360" height="1080" fill="#6f8fd6"/>
    <rect x="790"  y="0" width="360" height="1080" fill="#e0427a"/>
    <rect x="1150" y="0" width="360" height="1080" fill="#4fb3a6"/>
  </g>

  <!-- mirror-gallery scanlines -->
  <g opacity="0.06" fill="#ffffff">
    <rect x="0" y="120" width="1920" height="2"/>
    <rect x="0" y="300" width="1920" height="2"/>
    <rect x="0" y="540" width="1920" height="2"/>
    <rect x="0" y="780" width="1920" height="2"/>
    <rect x="0" y="960" width="1920" height="2"/>
  </g>

  <!-- title with chromatic-aberration ghosts (the "echo" of the word) -->
  <g text-anchor="middle">
    <text class="ttl" x="970" y="520" fill="#e0427a" opacity="0.55">ECHO</text>
    <text class="ttl" x="950" y="520" fill="#4fb3a6" opacity="0.55">ECHO</text>
    <text class="ttl" x="960" y="520" fill="#f4f7ff">ECHO</text>

    <!-- reflected echo of the title below -->
    <g transform="translate(960,690) scale(1,-1)" opacity="0.18">
      <text class="ttl" x="0" y="0" text-anchor="middle" fill="url(#fade)">ECHO</text>
    </g>
  </g>

  <!-- Han subtitle + tagline -->
  <text class="han" x="960" y="760" text-anchor="middle" fill="#cdd8ef">回 声</text>
  <text class="sub" x="960" y="852" text-anchor="middle" fill="#8aa0c8">REFUSE TO BECOME AN ECHO</text>

  <!-- corner protocol tags -->
  <text class="tag" x="120"  y="980" fill="#6f8fd6">ORDER</text>
  <text class="tag" x="960"  y="1000" text-anchor="middle" fill="#e0427a">CHAOS</text>
  <text class="tag" x="1800" y="980" text-anchor="end" fill="#4fb3a6">SHELTER</text>
</svg>
